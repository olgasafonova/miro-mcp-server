name: Miro API Tracking

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Manual trigger

permissions:
  issues: write
  contents: read

jobs:
  check-api-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download latest Miro OpenAPI spec
        run: |
          # Retry on transient failures (e.g. raw.githubusercontent.com 429 rate limits)
          curl -fsSL \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "https://raw.githubusercontent.com/miroapp/api-clients/main/packages/generator/spec.json" \
            -o /tmp/miro-spec-latest.json

      - name: Run spec diff
        id: diff
        run: |
          set +e
          python3 api-tracking/diff-spec.py \
            api-tracking/spec-baseline.json \
            /tmp/miro-spec-latest.json > /tmp/diff-report.md
          echo "has_changes=$?" >> "$GITHUB_OUTPUT"

      # The spec omits endpoints Miro actually ships (see api-tracking/README.md),
      # so a second layer probes the API itself for the watchlisted paths.
      # Needs the MIRO_PROBE_TOKEN secret; skipped without it (exit 2 = config
      # error, treated as no-drift so a missing secret never files an issue).
      - name: Run live probes
        id: probe
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_PROBE_TOKEN }}
        run: |
          set +e
          if [ -z "$MIRO_ACCESS_TOKEN" ]; then
            echo "No MIRO_PROBE_TOKEN secret; skipping live probes." > /tmp/probe-report.md
            echo "has_drift=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 api-tracking/live-probe.py \
            api-tracking/probe-watchlist.json > /tmp/probe-report.md
          status=$?
          if [ "$status" = "1" ]; then
            echo "has_drift=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_drift=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure api-tracking label exists
        if: steps.diff.outputs.has_changes == '1' || steps.probe.outputs.has_drift == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create api-tracking \
            --color "0E8A16" \
            --description "Automated Miro OpenAPI spec change detection" \
            --force

      - name: Create issue if changes found
        if: steps.diff.outputs.has_changes == '1' || steps.probe.outputs.has_drift == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Miro API changes detected ($(date +%Y-%m-%d))"

          BODY=$(cat <<'DELIM'
          ## Automated API Tracking

          The weekly Miro API check found changes since our last baseline.

          DELIM
          )
          if [ "${{ steps.diff.outputs.has_changes }}" = "1" ]; then
            BODY="${BODY}

          $(cat /tmp/diff-report.md)"
          fi
          if [ "${{ steps.probe.outputs.has_drift }}" = "1" ]; then
            BODY="${BODY}

          $(cat /tmp/probe-report.md)"
          fi
          BODY="${BODY}

          ---

          **Next steps:**
          1. Review changes above
          2. Implement new endpoints or update existing ones
          3. Spec changes: update baseline via \`cp /tmp/miro-spec-latest.json api-tracking/spec-baseline.json\`
          4. Probe drift: verify by hand, update \`known_status\` in \`api-tracking/probe-watchlist.json\`
          5. Close this issue

          _Generated by [api-tracking workflow](../../.github/workflows/api-tracking.yml)_"

          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "api-tracking"

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.has_changes }}" = "1" ]; then
            echo "### Spec changes detected" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/diff-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No spec changes" >> "$GITHUB_STEP_SUMMARY"
            echo "Miro API spec matches our baseline." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/probe-report.md >> "$GITHUB_STEP_SUMMARY"
